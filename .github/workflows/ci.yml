name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync deps
        run: uv sync
        working-directory: warcraft-raid-heatmap

      - name: Ruff
        run: uv run ruff check .
        working-directory: warcraft-raid-heatmap

      - name: Black
        run: uv run black --check .
        working-directory: warcraft-raid-heatmap

      - name: Mypy
        run: uv run mypy .
        working-directory: warcraft-raid-heatmap

      - name: Pytest
        run: uv run pytest -q
        working-directory: warcraft-raid-heatmap

