[project]
name = "warcraft-raid-heatmap"
version = "0.1.0"
description = "Minimal FastAPI app to analyze Warcraft Logs report and render draggable raid frames heatmap by CPM"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Stef", email = "" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.3",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "python-multipart",
  "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "ruff>=0.5.0",
  "black>=24.4.2",
  "types-requests>=2.32.0.20240712",
]

[tool.uv]
dev-dependencies = ["warcraft-raid-heatmap[dev]"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E","F","I","B","UP"]
ignore = ["E203","E501"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true


[project.scripts]
dev = "uvicorn app.main:app --reload"
lint = "ruff check ."
format = "black ."
typecheck = "mypy ."
